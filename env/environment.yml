# Environment that ran the iTRAILS chapter worked example (itrails 2.0.6).
# Recreate:   conda env create -f env/environment.yml && conda activate itrails_chapter_26
# Exact Linux x86-64 rebuild:
#   conda create -n itrails_chapter_26 --file env/conda-linux-64-explicit.txt
#   conda activate itrails_chapter_26 && pip install -r env/requirements.txt
