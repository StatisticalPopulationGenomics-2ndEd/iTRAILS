# Example configuration for itrails-optimize (itrails 2.0.5)
fixed_parameters:
  mu: 1.25e-8

optimized_parameters: # [starting, min, max]
  N_AB: [170000, 1000, 2000000]
  N_ABC: [100000, 10000, 3000000]
  t_A: [220000, 50000, 2000000]
  t_B: [220000, 50000, 2000000]
  t_2: [195000, 5000, 1000000]
  t_upper: [216139, 1000, 2000000] # = t_3 - N_ABC*ln(3); equivalent t_3 = 216139 + 100000*ln(3) = 326000.23 (t_3 omitted: ignored when t_upper is given)
  r: [1.2e-8, 1.0e-10, 1.0e-7]

settings:
  input_maf: ./data/input/optimization/4way_chr1_human_chimp_gorilla_orangutan.maf
  output_prefix: ./data/output/optimization/example
  n_cpu: 64
  method: "Nelder-Mead"
  species_list: ["hg38", "panTro5", "gorGor5", "ponAbe2"]
  n_int_AB: 3
  n_int_ABC: 3
  n_iter: 100000
